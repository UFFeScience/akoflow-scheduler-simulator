<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beam search scheduling tree</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #0f62fe;
      --accent-soft: #e8f1ff;
      --cost: #b45309;
      --cost-soft: #fef3c7;
      --explore: #7c3aed;
      --explore-soft: #ede9fe;
      --time: #0f766e;
      --time-soft: #ccfbf1;
      --good: #166534;
      --good-soft: #dcfce7;
      --drop: #9ca3af;
      --drop-soft: #f3f4f6;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1500px, calc(100vw - 24px));
      margin: 12px auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 36px;
      color: #ffffff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 800;
      padding: 0 12px;
    }

    button.secondary {
      color: var(--accent);
      background: #ffffff;
    }

    .stage {
      overflow: auto;
      background: var(--panel);
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
    }

    .canvas {
      position: relative;
      width: 1480px;
      height: 900px;
      margin: 0 auto;
      background:
        linear-gradient(#ffffff 0 0) padding-box,
        radial-gradient(circle at 24px 24px, #e5e7eb 1px, transparent 1px);
      background-size: auto, 32px 32px;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .step-title {
      position: absolute;
      left: 28px;
      top: 22px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
    }

    .step-title span {
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-size: 12px;
      padding: 5px 9px;
    }

    .legend {
      position: absolute;
      right: 28px;
      top: 20px;
      z-index: 2;
      display: flex;
      gap: 8px;
      font-size: 11px;
      font-weight: 900;
    }

    .legend b {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 5px 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.drop {
      background: var(--danger);
    }

    .dot.pick {
      background: var(--good);
    }

    .layer-label {
      fill: #64748b;
      font-size: 12px;
      font-weight: 900;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .gate {
      opacity: 0;
      fill: rgba(15, 98, 254, 0.055);
      stroke: var(--accent);
      stroke-dasharray: 9 7;
      stroke-width: 2;
      transition: opacity 280ms ease;
    }

    .gate.visible {
      opacity: 1;
    }

    .link {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5;
      opacity: 0.08;
      transition: opacity 280ms ease, stroke 280ms ease, stroke-width 280ms ease;
    }

    .link.visible {
      opacity: 0.58;
    }

    .link.keep {
      opacity: 1;
      stroke: var(--accent);
      stroke-width: 3.2;
    }

    .link.drop {
      opacity: 0.4;
      stroke: var(--drop);
      stroke-dasharray: 7 6;
    }

    .link.selected {
      opacity: 1;
      stroke: var(--good);
      stroke-width: 5;
    }

    .node {
      opacity: 0.06;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .node.visible {
      opacity: 1;
    }

    .node rect.card {
      x: -70px;
      y: -34px;
      width: 140px;
      height: 68px;
      rx: 7px;
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 2;
      transition: fill 280ms ease, stroke 280ms ease, stroke-width 280ms ease;
    }

    .node.root rect.card {
      height: 58px;
      y: -29px;
    }

    .node.cost rect.card {
      fill: var(--cost-soft);
      stroke: var(--cost);
    }

    .node.explore rect.card {
      fill: var(--explore-soft);
      stroke: var(--explore);
    }

    .node.time rect.card {
      fill: var(--time-soft);
      stroke: var(--time);
    }

    .node.keep rect.card {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .node.drop {
      opacity: 0.32;
      transform: scale(0.96);
    }

    .node.drop rect.card {
      fill: var(--drop-soft);
      stroke: var(--drop);
    }

    .node.selected rect.card {
      fill: var(--good-soft);
      stroke: var(--good);
      stroke-width: 3.5;
    }

    .node text {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 900;
      text-anchor: middle;
    }

    .node text.meta {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .node text.score {
      fill: #334155;
      font-size: 11px;
      font-weight: 900;
    }

    .metric-bg {
      x: -52px;
      y: 18px;
      width: 104px;
      height: 6px;
      rx: 999px;
      fill: #e2e8f0;
    }

    .metric-fill {
      x: -52px;
      y: 18px;
      height: 6px;
      rx: 999px;
      fill: var(--accent);
      transition: width 280ms ease;
    }

    .node.drop .metric-fill {
      fill: var(--drop);
    }

    .node.selected .metric-fill {
      fill: var(--good);
    }

    .slash {
      stroke: var(--danger);
      stroke-width: 3;
      opacity: 0;
      transition: opacity 280ms ease;
    }

    .node.drop .slash {
      opacity: 1;
    }

    .rank {
      opacity: 0;
      transition: opacity 280ms ease;
    }

    .rank.visible {
      opacity: 1;
    }

    .rank rect {
      fill: #ffffff;
      stroke: var(--good);
      stroke-width: 2;
      rx: 999px;
    }

    .rank text {
      fill: var(--good);
      font-size: 12px;
      font-weight: 900;
      text-anchor: middle;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      padding: 10px 14px 14px;
      background: #ffffff;
      border-top: 1px solid #eef2f7;
    }

    .tick {
      height: 8px;
      border-radius: 999px;
      background: #d8dee9;
      transition: background 280ms ease;
    }

    .tick.active {
      background: var(--accent);
    }

    body.clean main {
      width: 1480px;
      margin: 0;
    }

    body.clean .toolbar,
    body.clean .timeline {
      display: none;
    }

    body.clean .stage {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .toolbar {
        display: grid;
      }

      .controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>

            <rect x="-54" y="-14" width="108" height="28"></rect><text y="4">rank 3</text>
          </g>
        </svg>
      </div>
      <div class="timeline" aria-hidden="true">
        <span class="tick active"></span>
        <span class="tick"></span>
        <span class="tick"></span>
        <span class="tick"></span>
        <span class="tick"></span>
        <span class="tick"></span>
        <span class="tick"></span>
        <span class="tick"></span>
      </div>
    </section>
  </main>

  <script>
    const roots = ["root-cost", "root-exp", "root-time"];
    const layer1 = ["c1", "c2", "c3", "e1", "e2", "e3", "t1", "t2", "t3"];
    const layer2 = ["c1a", "c1b", "c2a", "e1a", "e2a", "e3a", "t1a", "t2a", "t3a"];
    const finals = ["f2", "f1", "f4", "f3", "f5"];
    const recs = ["r2", "r1", "r3"];
    const rootLinks = ["l-root-cost-c1", "l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e1", "l-root-exp-e2", "l-root-exp-e3", "l-root-time-t1", "l-root-time-t2", "l-root-time-t3"];
    const layer2Links = ["l-c1-c1a", "l-c1-c1b", "l-c2-c2a", "l-e1-e1a", "l-e2-e2a", "l-e3-e3a", "l-t1-t1a", "l-t2-t2a", "l-t3-t3a"];
    const finalLinks = ["l-c1a-f2", "l-e1a-f1", "l-e2a-f4", "l-t1a-f3", "l-t2a-f5"];
    const recLinks = ["l-f2-r2", "l-f1-r1", "l-f3-r3"];
    const keep1 = ["c1", "e1", "e2", "t1"];
    const drop1 = ["c2", "c3", "e3", "t2", "t3"];
    const keep2 = ["c1a", "e1a", "e2a", "t1a"];
    const drop2 = ["c1b", "c2a", "e3a", "t2a", "t3a"];
    const keepFinal = ["f2", "f1", "f4", "f3"];
    const dropFinal = ["f5"];
    const selectedPath = ["root-exp", "e1", "e1a", "f1", "r1"];
    const selectedLinks = ["l-root-exp-e1", "l-e1-e1a", "l-e1a-f1", "l-f1-r1"];

    const steps = [
      {
        label: "1/8",
        title: "create objective frontiers",
        gates: [],
        visible: roots,
        keep: [],
        drop: [],
        links: [],
        keepLinks: [],
        dropLinks: [],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "2/8",
        title: "expand candidates for task 1",
        gates: [],
        visible: roots.concat(layer1),
        keep: [],
        drop: [],
        links: rootLinks,
        keepLinks: [],
        dropLinks: [],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "3/8",
        title: "beam width keeps top states",
        gates: ["gate-1"],
        visible: roots.concat(layer1),
        keep: keep1,
        drop: drop1,
        links: rootLinks,
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3"],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "4/8",
        title: "expand only the surviving states",
        gates: ["gate-1"],
        visible: roots.concat(layer1, layer2),
        keep: keep1,
        drop: drop1,
        links: rootLinks.concat(layer2Links),
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3"],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "5/8",
        title: "prune next layer",
        gates: ["gate-1", "gate-2"],
        visible: roots.concat(layer1, layer2),
        keep: keep1.concat(keep2),
        drop: drop1.concat(drop2),
        links: rootLinks.concat(layer2Links),
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1", "l-c1-c1a", "l-e1-e1a", "l-e2-e2a", "l-t1-t1a"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3", "l-c1-c1b", "l-c2-c2a", "l-e3-e3a", "l-t2-t2a", "l-t3-t3a"],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "6/8",
        title: "build final schedules",
        gates: ["gate-1", "gate-2", "gate-3"],
        visible: roots.concat(layer1, layer2, finals),
        keep: keep1.concat(keep2, keepFinal),
        drop: drop1.concat(drop2, dropFinal),
        links: rootLinks.concat(layer2Links, finalLinks),
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1", "l-c1-c1a", "l-e1-e1a", "l-e2-e2a", "l-t1-t1a", "l-c1a-f2", "l-e1a-f1", "l-e2a-f4", "l-t1a-f3"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3", "l-c1-c1b", "l-c2-c2a", "l-e3-e3a", "l-t2-t2a", "l-t3-t3a", "l-t2a-f5"],
        selected: [],
        selectedLinks: [],
        ranks: []
      },
      {
        label: "7/8",
        title: "rank recommendation items",
        gates: ["gate-1", "gate-2", "gate-3"],
        visible: roots.concat(layer1, layer2, finals, recs),
        keep: keep1.concat(keep2, keepFinal, recs),
        drop: drop1.concat(drop2, dropFinal),
        links: rootLinks.concat(layer2Links, finalLinks, recLinks),
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1", "l-c1-c1a", "l-e1-e1a", "l-e2-e2a", "l-t1-t1a", "l-c1a-f2", "l-e1a-f1", "l-e2a-f4", "l-t1a-f3", "l-f2-r2", "l-f1-r1", "l-f3-r3"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3", "l-c1-c1b", "l-c2-c2a", "l-e3-e3a", "l-t2-t2a", "l-t3-t3a", "l-t2a-f5"],
        selected: [],
        selectedLinks: [],
        ranks: ["rank-r2", "rank-r1", "rank-r3"]
      },
      {
        label: "8/8",
        title: "select Recommendation #1",
        gates: ["gate-1", "gate-2", "gate-3"],
        visible: roots.concat(layer1, layer2, finals, recs),
        keep: keep1.concat(keep2, keepFinal, recs),
        drop: drop1.concat(drop2, dropFinal),
        links: rootLinks.concat(layer2Links, finalLinks, recLinks),
        keepLinks: ["l-root-cost-c1", "l-root-exp-e1", "l-root-exp-e2", "l-root-time-t1", "l-c1-c1a", "l-e1-e1a", "l-e2-e2a", "l-t1-t1a", "l-c1a-f2", "l-e1a-f1", "l-e2a-f4", "l-t1a-f3", "l-f2-r2", "l-f1-r1", "l-f3-r3"],
        dropLinks: ["l-root-cost-c2", "l-root-cost-c3", "l-root-exp-e3", "l-root-time-t2", "l-root-time-t3", "l-c1-c1b", "l-c2-c2a", "l-e3-e3a", "l-t2-t2a", "l-t3-t3a", "l-t2a-f5"],
        selected: selectedPath,
        selectedLinks,
        ranks: ["rank-r2", "rank-r1", "rank-r3"]
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const clean = params.get("clean") === "1";
    const autoplay = params.get("autoplay") === "1";
    const intervalMs = Number(params.get("speed")) || 1800;
    if (clean) document.body.classList.add("clean");

    let index = 0;
    let timer = null;
    const stepLabel = document.getElementById("step-label");
    const stepTitle = document.getElementById("step-title");
    const nodes = Array.from(document.querySelectorAll(".node"));
    const links = Array.from(document.querySelectorAll(".link"));
    const gates = Array.from(document.querySelectorAll(".gate"));
    const ranks = Array.from(document.querySelectorAll(".rank"));
    const ticks = Array.from(document.querySelectorAll(".tick"));

    function render() {
      const step = steps[index];
      stepLabel.textContent = step.label;
      stepTitle.textContent = step.title;

      nodes.forEach((node) => {
        node.classList.toggle("visible", step.visible.includes(node.id));
        node.classList.toggle("keep", step.keep.includes(node.id));
        node.classList.toggle("drop", step.drop.includes(node.id));
        node.classList.toggle("selected", step.selected.includes(node.id));
      });

      links.forEach((link) => {
        link.classList.toggle("visible", step.links.includes(link.id));
        link.classList.toggle("keep", step.keepLinks.includes(link.id));
        link.classList.toggle("drop", step.dropLinks.includes(link.id));
        link.classList.toggle("selected", step.selectedLinks.includes(link.id));
      });

      gates.forEach((gate) => {
        gate.classList.toggle("visible", step.gates.includes(gate.id));
      });

      ranks.forEach((rank) => {
        rank.classList.toggle("visible", step.ranks.includes(rank.id));
      });

      ticks.forEach((tick, tickIndex) => {
        tick.classList.toggle("active", tickIndex <= index);
      });
    }

    function next() {
      index = (index + 1) % steps.length;
      render();
    }

    function prev() {
      index = (index - 1 + steps.length) % steps.length;
      render();
    }

    function play() {
      const playButton = document.getElementById("play");
      if (timer) {
        clearInterval(timer);
        timer = null;
        playButton.textContent = "Reproduzir";
        return;
      }
      playButton.textContent = "Pausar";
      timer = setInterval(next, intervalMs);
    }

    document.getElementById("next").addEventListener("click", next);
    document.getElementById("prev").addEventListener("click", prev);
    document.getElementById("play").addEventListener("click", play);
    render();
    if (autoplay) play();
  </script>
</body>
</html>
