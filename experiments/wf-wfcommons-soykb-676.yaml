name: wfcommons-soykb-676
spec:
  runtime: "k8s1"
  namespace: "akoflow"
  image: wfcommons/soykb:latest
  activities:
    - name: alignmenttoreferenceid0000001
      run: "alignment_to_reference mem -t 2 -M Gmax_275_v2.0.fa USB-001_1.fastq USB-001_2.fastq"
      memoryLimit: 256Mi
      cpuLimit: 1.0

    - name: sortsamid0000002
      run: "sort_sam SortSam.jar CREATE_INDEX=TRUE MAX_RECORDS_IN_RAM=5000000 TMP_DIR=. I=20200407-151427-USB-001_aligned_reads.sam O=20200407-151427-USB-001_sorted_reads.bam SO=coordinate VALIDATION_STRINGENCY=LENIENT"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - alignmenttoreferenceid0000001

    - name: dedupid0000003
      run: "dedup MarkDuplicates.jar CREATE_INDEX=TRUE MAX_RECORDS_IN_RAM=5000000 TMP_DIR=. I=20200407-151427-USB-001_sorted_reads.bam O=20200407-151427-USB-001_deduped_reads.bam METRICS_FILE=20200407-151427-USB-001_deduped.metrics VALIDATION_STRINGENCY=LENIENT"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - sortsamid0000002

    - name: addreplaceid0000004
      run: "add_replace AddOrReplaceReadGroups.jar MAX_RECORDS_IN_RAM=5000000 TMP_DIR=. I=20200407-151427-USB-001_deduped_reads.bam O=20200407-151427-USB-001_addrepl.bam RGID=USB-001 LB=USB-001 PL=Illumina SM=USB-001 CN=BGI RGPU=USB-001 VALIDATION_STRINGENCY=LENIENT SORT_ORDER=coordinate CREATE_INDEX=TRUE"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - dedupid0000003

    - name: realigntargetcreatorid0000005
      run: "realign_target_creator -T RealignerTargetCreator -nt 2 -R Gmax_275_v2.0.fa -I 20200407-151427-USB-001_addrepl.bam -o 20200407-151427-USB-001_intervals.list"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - addreplaceid0000004

    - name: indelrealignid0000006
      run: "indel_realign -T IndelRealigner -R Gmax_275_v2.0.fa -I 20200407-151427-USB-001_addrepl.bam -targetIntervals 20200407-151427-USB-001_intervals.list -o 20200407-151427-USB-001_indel_realigned.bam"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - addreplaceid0000004
        - realigntargetcreatorid0000005

    - name: haplotypecallerid0000007
      run: "haplotype_caller -T HaplotypeCaller --emitRefConfidence GVCF --variant_index_type LINEAR --variant_index_parameter 128000 -L Chr01 -R Gmax_275_v2.0.fa -I 20200407-151427-USB-001_indel_realigned.bam -o 20200407-151427-USB-001_Chr01.vcf"
      memoryLimit: 256Mi
      cpuLimit: 1.0
      dependsOn:
        - indelrealignid0000006

